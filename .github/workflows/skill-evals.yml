name: Live skill evals

# Runs skill evaluations using LLM-as-judge against Claude Code and/or Codex.
# Evaluations are defined in skills/<skill>/evals/<skill>.md markdown files.
# Each skill runs as a separate job for parallelism and targeted re-runs.
on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".agents/**"
      - "skills/**"
      - "scripts/eval_judge.py"
      - "scripts/test_eval_judge.py"
      - ".github/workflows/skill-evals.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      skill:
        description: "Only run evals for this skill id (empty: all)"
        required: false
        default: ""
      agent:
        description: "Agent to test (claude, codex, or both)"
        required: false
        default: "claude"
        type: choice
        options:
          - claude
          - codex
          - both
      model:
        description: "Model alias or name (agent-specific)"
        required: false
        default: ""
      repeat:
        description: "Runs per prompt"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: skill-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determine which skills to evaluate based on changed files
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      run_all: ${{ steps.detect.outputs.run_all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed skills
        id: detect
        run: |
          # If workflow_dispatch with specific skill, use that
          if [ -n "${{ inputs.skill }}" ]; then
            echo "skills=[\"${{ inputs.skill }}\"]" >> $GITHUB_OUTPUT
            echo "run_all=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # If scheduled or framework changed, run all skills (except guardrails)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run_all=true" >> $GITHUB_OUTPUT
            # All skills except docker-destructive-guardrails (too flaky for CI)
            echo 'skills=["docker-agent-config","docker-agent-deploy","docker-agent-run","docker-build-strategies","docker-compose-patterns","docker-docs","docker-project-foundations","docker-sandboxes-env","docker-sandboxes-kits","docker-sandboxes-lifecycle","docker-sandboxes-network-credentials"]' >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get changed files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
          else
            BASE_SHA=${{ github.event.before }}
            HEAD_SHA=${{ github.sha }}
          fi
          
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "")
          
          # Check if framework files changed
          FRAMEWORK_CHANGED=false
          if echo "$CHANGED_FILES" | grep -qE '^(scripts/eval_judge\.py|\.github/workflows/skill-evals\.yml|\.claude-plugin/|\.codex-plugin/|\.agents/)'; then
            FRAMEWORK_CHANGED=true
          fi
          
          if [ "$FRAMEWORK_CHANGED" = "true" ]; then
            echo "run_all=true" >> $GITHUB_OUTPUT
            # All skills except docker-destructive-guardrails
            echo 'skills=["docker-agent-config","docker-agent-deploy","docker-agent-run","docker-build-strategies","docker-compose-patterns","docker-docs","docker-project-foundations","docker-sandboxes-env","docker-sandboxes-kits","docker-sandboxes-lifecycle","docker-sandboxes-network-credentials"]' >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Extract specific skills that changed
          SKILLS=$(echo "$CHANGED_FILES" | grep -oE '^skills/[^/]+' | sed 's|skills/||' | sort -u | grep -v '^docker-destructive-guardrails$' || true)
          
          if [ -z "$SKILLS" ]; then
            echo "No skill changes detected"
            echo "skills=[]" >> $GITHUB_OUTPUT
            echo "run_all=false" >> $GITHUB_OUTPUT
          else
            # Convert to JSON array
            SKILLS_JSON=$(echo "$SKILLS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "skills=$SKILLS_JSON" >> $GITHUB_OUTPUT
            echo "run_all=false" >> $GITHUB_OUTPUT
          fi

  plugin-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLAUDE_CODE_VERSION: "2.1.316"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: |
          npm install --global --ignore-scripts "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          node "$(npm root --global)/@anthropic-ai/claude-code/install.cjs"

      - name: Validate plugin manifest
        run: claude plugin validate .

  # Claude evals - one job per skill
  eval-claude:
    needs: detect-changes
    if: |
      (inputs.agent == 'claude' || inputs.agent == 'both' || inputs.agent == '') &&
      needs.detect-changes.outputs.skills != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.detect-changes.outputs.skills) }}
    env:
      CLAUDE_CODE_VERSION: "2.1.316"
      SBX_VERSION: "0.50.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Docker Sandboxes (sbx)
        run: |
          curl -fsSL "https://github.com/docker/sbx-releases/releases/download/v${SBX_VERSION}/DockerSandboxes-linux-amd64-ubuntu2404.deb" -o sbx.deb
          sudo apt-get install -y ./sbx.deb
          sudo usermod -aG kvm "$USER"
          rm sbx.deb
          sbx version

      - name: Setup sbx (login and policy)
        env:
          DOCKERPUBLICBOT_READ_PAT: ${{ secrets.DOCKERPUBLICBOT_READ_PAT }}
          DOCKERPUBLICBOT_USERNAME: ${{ vars.DOCKERPUBLICBOT_USERNAME }}
        run: |
          sg kvm -c 'echo "$DOCKERPUBLICBOT_READ_PAT" | sbx login --username "$DOCKERPUBLICBOT_USERNAME" --password-stdin'
          sg kvm -c 'sbx policy init balanced'

      - name: Install Claude Code
        run: |
          npm install --global --ignore-scripts "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          node "$(npm root --global)/@anthropic-ai/claude-code/install.cjs"
          claude --version

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes -r scripts/requirements.txt

      - name: Run eval for ${{ matrix.skill }} (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_MODEL: ${{ inputs.model || 'sonnet' }}
          INPUT_REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          .venv/bin/python scripts/eval_judge.py \
            --agent claude \
            --model "$INPUT_MODEL" \
            --repeat "$INPUT_REPEAT" \
            --skill "${{ matrix.skill }}"

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-claude-${{ matrix.skill }}
          path: .eval-judge/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup sandboxes
        if: always()
        run: |
          sbx ls -q 2>/dev/null | grep "^eval-" | xargs -r sbx rm --force || true
          sbx daemon stop || true

  # Codex evals - one job per skill
  eval-codex:
    needs: detect-changes
    if: |
      (inputs.agent == 'codex' || inputs.agent == 'both') &&
      needs.detect-changes.outputs.skills != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.detect-changes.outputs.skills) }}
    env:
      CODEX_VERSION: "0.166.0"
      SBX_VERSION: "0.50.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Docker Sandboxes (sbx)
        run: |
          curl -fsSL "https://github.com/docker/sbx-releases/releases/download/v${SBX_VERSION}/DockerSandboxes-linux-amd64-ubuntu2404.deb" -o sbx.deb
          sudo apt-get install -y ./sbx.deb
          sudo usermod -aG kvm "$USER"
          rm sbx.deb
          sbx version

      - name: Setup sbx (login and policy)
        env:
          DOCKERPUBLICBOT_READ_PAT: ${{ secrets.DOCKERPUBLICBOT_READ_PAT }}
          DOCKERPUBLICBOT_USERNAME: ${{ vars.DOCKERPUBLICBOT_USERNAME }}
        run: |
          sg kvm -c 'echo "$DOCKERPUBLICBOT_READ_PAT" | sbx login --username "$DOCKERPUBLICBOT_USERNAME" --password-stdin'
          sg kvm -c 'sbx policy init balanced'

      - name: Install Codex
        run: |
          npm install --global "@openai/codex@${CODEX_VERSION}"
          codex --version

      - name: Configure Codex for Docker AI Gateway
        env:
          DOCKERPUBLICBOT_READ_PAT: ${{ secrets.DOCKERPUBLICBOT_READ_PAT }}
          DOCKERPUBLICBOT_USERNAME: ${{ vars.DOCKERPUBLICBOT_USERNAME }}
        run: |
          JWT=$(curl -s -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERPUBLICBOT_USERNAME}\",\"password\":\"${DOCKERPUBLICBOT_READ_PAT}\"}" \
            | jq -r '.token')
          
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "::error::Failed to get Docker Hub JWT token"
            exit 1
          fi
          
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml << EOF
          model_provider = "docker-gateway"
          
          [model_providers.docker-gateway]
          name = "Docker AI Gateway"
          base_url = "https://gw.docker.com/v1/docker/gateways/default/inference/openai/v1"
          env_key = "DOCKER_GATEWAY_TOKEN"
          wire_api = "responses"
          requires_openai_auth = false
          EOF
          
          echo "DOCKER_GATEWAY_TOKEN=${JWT}" >> $GITHUB_ENV
          echo "::add-mask::${JWT}"

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes -r scripts/requirements.txt

      - name: Run eval for ${{ matrix.skill }} (Codex)
        env:
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          model_arg=""
          if [ -n "$INPUT_MODEL" ]; then
            model_arg="--model $INPUT_MODEL"
          fi
          .venv/bin/python scripts/eval_judge.py \
            --agent codex \
            $model_arg \
            --repeat "$INPUT_REPEAT" \
            --skill "${{ matrix.skill }}"

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-codex-${{ matrix.skill }}
          path: .eval-judge/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup sandboxes
        if: always()
        run: |
          sbx ls -q 2>/dev/null | grep "^eval-" | xargs -r sbx rm --force || true
          sbx daemon stop || true
